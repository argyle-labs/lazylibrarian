[package]
name = "lazylibrarian"
version = "0.1.0"
edition = "2021"
description = "LazyLibrarian ebook/audiobook library manager — orca service-backend"

[package.metadata.orca]
category = "downloads"

[lib]
name = "lazylibrarian"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "lazylibrarian"
path = "src/main.rs"

# lazylibrarian is a BACKEND-ONLY orca plugin: zero #[orca_tool]s. It registers a
# ServiceBackend over the orca socket and reaches the whole orca system
# through plugin-toolkit alone.
[dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", branch = "main" }

[dev-dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", branch = "main" }
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
wiremock = "0.6"

[lints.clippy]
let_underscore_must_use = "deny"
