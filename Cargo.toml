[package]
name = "lazylibrarian"
version = "0.1.0"
edition = "2021"
description = "LazyLibrarian ebook/audiobook library manager — orca service-backend"

[package.metadata.orca]
category = "downloads"

[lib]
name = "lazylibrarian"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "lazylibrarian"
path = "src/main.rs"

[dependencies]
plugin-toolkit = { version = "=0.2.1-rc.47", registry = "gitea", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db", "delegated-http"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }

[lints.clippy]
let_underscore_must_use = "deny"
